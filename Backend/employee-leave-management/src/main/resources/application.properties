spring.application.name=employee-leave-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/employee_leave_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-this-secret-key-to-a-long-random-value-for-production-use-123456789
app.jwt.expiration-ms=86400000
